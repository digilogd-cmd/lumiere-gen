# LUMIÈRE GEN(뤼미에르 젠) 엔진 기본값 — 누구에게나 맞는 중립값. 내 채널·내 스타일 값은 대시보드 [설정](설정.json, 내 스타일 층)에 둔다.
# (설정.json 이 이 파일 위에 덮어쓴다. 공장 초기화해도 설정.json 은 남는다)
# 비밀 정보(토큰·API 키)는 여기 넣지 말고 .env 에만 둔다.
# 촬영본 편집 값(습관어·무음·줌·얼굴 화면·블러·쇼츠 등)은 뤼미에르 에디트에만 있다(2026-10-09 분리 정리).

채널:
  이름: ""                       # 내 채널 이름(설정 창) — 썸네일 구석 글자(로고가 없을 때)
  로고: ""                       # 썸네일 좌하단 로고 PNG(검정 배경+흰 심볼). 비우면 채널 이름, 그것도 없으면 아무것도 안 그림

# 제작 팀장(대화창에서 사용자와 이야기하는 AI의 이름 — 설정 창에서 바꿀 수 있음)
팀장:
  이름: 오귀스트                 # 뤼미에르 젠 제작 팀장(형 오귀스트 뤼미에르). 에디트의 팀장은 루이

# 받아쓰기(목소리 시각 재기 — 자막을 목소리에 맞춤)
받아쓰기:
  모델: medium                   # faster-whisper 모델(medium 권장, 정확도 더 필요하면 large-v3)
  장치: auto                     # auto | cuda | cpu
  언어: ko

# 자막
자막:
  한줄최대: 34                   # 가로 영상 한 줄 최대 글자(세로는 16)
  마침표_빼기: true             # 2026-10-07: 문장 끝 마침표는 다 뺀다

# 종편(완성본)
종편:
  음량_LUFS: -11                 # 2026-10-05 확정. 최대 피크 -1 dBTP

# 두뇌(AI) — Task마다 다르게 고를 수 있음. claude | codex | openai | gemini | local
두뇌:
  기본: claude
  claude_모델: sonnet
  local_주소: http://localhost:11434/v1   # Ollama/LM Studio OpenAI 호환 주소
  local_모델: qwen2.5:14b
  task별: {}                     # 예: { gen_board: claude, titles_desc: local }

# 생성형 — 이미지·영상·음악·목소리는 Claude가 크롬으로 Google Flow·AI Studio·Flow Music을 움직여 만든다(API 안 씀)
생성:
  화풍: "따뜻한 수채화풍 일러스트"     # 기본 화풍(만들 때 --style 로 바꿈)
  목표_초: 90                     # 기본 길이
  세로: false                     # 기본 화면(true = 세로 9:16)
  화자_목소리: [Charon, Kore, Puck]  # AI Studio 목소리 이름(화자 1, 2, 3…)
  영상_클립_한도: 4               # Flow 영상(Veo) 클립 수 한도(크레딧)
  음악_한도: 3                    # Flow Music 곡 수 한도
  이미지_한도: 30                 # Flow 이미지 장수 한도(0크레딧이지만 시간)
  재시도_한도: 2                  # 브라우저 작업 하나를 다시 해 볼 횟수(넘으면 대체 방법)
  다운로드_폴더: ""               # 크롬이 받은 파일이 떨어지는 폴더. 비우면 크롬 설정에서 자동으로 찾음
  디졸브_초: 0.4                  # 컷 사이 겹쳐 바뀌기
  음악_크기: 0.42                 # 대사 밑 음악 크기. 말하는 동안은 더 눌림(사이드체인 덕킹)
  앞_여백_초: 0.6                 # 첫 말 앞
  뒤_여백_초: 2.5                 # 마지막 말 뒤(마지막 그림이 천천히 어두워짐)
